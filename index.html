<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Visor Panorámico 360° Interactivo</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #contenedor {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #000;
      pointer-events: none;
    }

    #boton-iniciar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 14px 28px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    #indicador {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="contenedor">
    <div id="indicador">Gira con el móvil o arrastra libremente</div>

    <model-viewer
      id="visor3d"
      src="panoramica.glb"
      alt="Entorno 360"
      scale="10 10 10"
      camera-target="0m 0m 0m"
      camera-orbit="0deg 90deg 0.1m"
      min-camera-orbit="auto auto 0.1m"
      max-camera-orbit="auto auto 0.1m"
      field-of-view="80deg">
    </model-viewer>

    <button id="boton-iniciar">Activar Sensor de Movimiento</button>
  </div>

  <script>
    const visor = document.getElementById('visor3d');
    const contenedor = document.getElementById('contenedor');
    const boton = document.getElementById('boton-iniciar');

    let theta = 0;
    let phi = 90;

    let ultimoAlpha = null;
    let sensorActivo = false;

    let touchX = 0;
    let touchY = 0;
    let isTouching = false;

    function actualizarCamara() {
      visor.cameraOrbit = `${theta}deg ${phi}deg 0.1m`;
    }

    visor.addEventListener('load', () => {
      visor.cameraTarget = '0m 0m 0m';
      actualizarCamara();
    });

    contenedor.addEventListener('touchstart', (e) => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      isTouching = true;
    }, { passive: true });

    contenedor.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      const dx = e.touches[0].clientX - touchX;
      const dy = e.touches[0].clientY - touchY;

      theta -= dx * 0.3;
      phi = Math.max(30, Math.min(150, phi + dy * 0.3));

      actualizarCamara();

      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });

    contenedor.addEventListener('touchend', () => {
      isTouching = false;
    });

    boton.addEventListener('click', async () => {
      boton.style.opacity = '0';
      setTimeout(() => { boton.style.display = 'none'; }, 300);

      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permiso = await DeviceOrientationEvent.requestPermission();
          if (permiso === 'granted') {
            iniciarSensor();
          }
        } catch (err) {
          console.warn('Permiso no concedido:', err);
        }
      } else {
        iniciarSensor();
      }
    });

    function iniciarSensor() {
      sensorActivo = true;
      window.addEventListener('deviceorientation', manejarOrientacion);
    }

    function manejarOrientacion(e) {
      if (e.alpha === null || e.beta === null) return;

      if (ultimoAlpha !== null) {
        let diffAlpha = e.alpha - ultimoAlpha;

        if (diffAlpha > 180) diffAlpha -= 360;
        if (diffAlpha < -180) diffAlpha += 360;

        theta -= diffAlpha;
      }
      ultimoAlpha = e.alpha;

      let inclinacionObjetivo = Math.max(35, Math.min(145, e.beta));
      phi = phi + (inclinacionObjetivo - phi) * 0.15;

      actualizarCamara();
    }
  </script>
</body>
</html>
