<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Visor Panorámico 360° Interactivo</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #contenedor {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    #boton-iniciar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 14px 28px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    #indicador {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="contenedor">
    <div id="indicador">Gira el móvil o arrastra para ver en 360°</div>

    <model-viewer
      id="visor3d"
      src="panoramica.glb"
      alt="Entorno 360"
      camera-controls
      disable-pan
      disable-zoom
      scale="10 10 10"
      camera-target="0m 0m 0m"
      camera-orbit="0deg 90deg 0.1m"
      min-camera-orbit="auto auto 0.1m"
      max-camera-orbit="auto auto 0.1m"
      field-of-view="80deg">
    </model-viewer>

    <button id="boton-iniciar">Activar Sensor de Movimiento</button>
  </div>

  <script>
    const visor = document.getElementById('visor3d');
    const boton = document.getElementById('boton-iniciar');

    let thetaActual = 0;
    let phiActual = 90;
    let thetaObjetivo = 0;
    let phiObjetivo = 90;

    let sensorIniciado = false;
    let alfaBase = null;

    boton.addEventListener('click', async () => {
      boton.style.opacity = '0';
      setTimeout(() => { boton.style.display = 'none'; }, 300);

      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permiso = await DeviceOrientationEvent.requestPermission();
          if (permiso === 'granted') {
            activarSensor();
          }
        } catch (err) {
          console.warn('Permiso no concedido:', err);
        }
      } else {
        activarSensor();
      }
    });

    function activarSensor() {
      sensorIniciado = true;
      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha === null || e.beta === null) return;

        if (alfaBase === null) {
          alfaBase = e.alpha;
        }

        // Horizontal: si notas que gira al revés horizontalmente, cambia '-deltaAlfa' por 'deltaAlfa'
        let deltaAlfa = e.alpha - alfaBase;
        thetaObjetivo = -deltaAlfa;

        // Vertical corregido: sin invertir los grados de inclinación frontal
        let inclinacion = Math.max(40, Math.min(140, e.beta));
        phiObjetivo = inclinacion;
      });
    }

    function bucleRender() {
      if (sensorIniciado) {
        thetaActual += (thetaObjetivo - thetaActual) * 0.08;
        phiActual += (phiObjetivo - phiActual) * 0.08;

        visor.cameraOrbit = `${thetaActual}deg ${phiActual}deg 0.1m`;
      }
      requestAnimationFrame(bucleRender);
    }

    bucleRender();
  </script>
</body>
</html>
